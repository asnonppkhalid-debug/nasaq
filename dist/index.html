<title>نَسَق | NASAQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* مفهوم التخطيط: خيط واحد يمرّ بكل شيء.
   التنقل = خرزات على خيط الترويسة، الدروس = خرزات على خيط عمودي،
   حالة المعرفة = خيط تتراكم عليه خرزات حقيقية. تركيب الصفحات غير متماثل، بلا شبكة بطاقات موحّدة. */
:root{
  /* ورق وحبر */
  --paper:#F3F5F2; --paper-2:#E8ECE7; --card:#FFFFFF;
  --ink:#14283A; --ink-2:#4B5E6D; --line:#D3DAD3;
  /* الخيط الأحمر: اللون الأساسي للعلامة */
  --thread:#E4472F; --thread-ink:#BE3822; --thread-soft:#FBDDD6;
  /* ألوان الخرز (مجالات المعرفة) */
  --c-saffron:#F2B632; --c-teal:#1FA38D; --c-sky:#4A8CE0; --c-rose:#E4688F; --c-leaf:#7DAE3A;
  --s-saffron:#FCEEC8; --s-teal:#D2EEE8; --s-sky:#DBE8FA; --s-rose:#F9DCE6; --s-leaf:#E3EFD0;
  --on-bead:#14283A; --focus:#2F6FE0; --scrim:rgba(10,22,32,.55);
  --danger:#B3341F; --danger-fg:#FFFFFF;
  /* شخصية خريزة (ثابتة في الوضعين) */
  --m-body:#F2B632; --m-ink:#14283A; --m-cheek:#FF8E78; --m-shine:#FFFFFF;
  /* الخطوط */
  --f-display:'Reem Kufi','Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
  --f-read:'Noto Naskh Arabic','Amiri','Traditional Arabic','Times New Roman',serif;
  --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  /* مقاس النص */
  --t-xs:.8125rem; --t-s:.9375rem; --t-m:1rem; --t-l:1.125rem; --t-xl:1.4rem;
  --t-2xl:clamp(1.7rem,3.6vw,2.4rem); --t-3xl:clamp(2.1rem,5.4vw,3.6rem);
  /* شكل ومسافات */
  --r-s:10px; --r-m:16px; --r-l:28px;
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2.25rem; --sp-7:3.5rem;
  --shadow:0 1px 0 rgba(20,40,58,.05),0 14px 34px -22px rgba(20,40,58,.45);
  --sec:var(--c-saffron); --sec-soft:var(--s-saffron);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A26; --paper-2:#0A141D; --card:#162636;
    --ink:#E9EFEA; --ink-2:#A3B4C0; --line:#28394A;
    --thread:#FF7A60; --thread-ink:#FF9680; --thread-soft:#43241F;
    --c-saffron:#F5C24D; --c-teal:#3DBBA5; --c-sky:#6EA6EE; --c-rose:#F08BAA; --c-leaf:#97C654;
    --s-saffron:#3A3115; --s-teal:#14362F; --s-sky:#17304F; --s-rose:#43202F; --s-leaf:#2A3A17;
    --on-bead:#0E1A26; --focus:#8DB8FF; --scrim:rgba(0,0,0,.65);
    --danger:#FF9680; --danger-fg:#14283A;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A26; --paper-2:#0A141D; --card:#162636;
  --ink:#E9EFEA; --ink-2:#A3B4C0; --line:#28394A;
  --thread:#FF7A60; --thread-ink:#FF9680; --thread-soft:#43241F;
  --c-saffron:#F5C24D; --c-teal:#3DBBA5; --c-sky:#6EA6EE; --c-rose:#F08BAA; --c-leaf:#97C654;
  --s-saffron:#3A3115; --s-teal:#14362F; --s-sky:#17304F; --s-rose:#43202F; --s-leaf:#2A3A17;
  --on-bead:#0E1A26; --focus:#8DB8FF; --scrim:rgba(0,0,0,.65);
  --danger:#FF9680; --danger-fg:#14283A;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* لون كل قسم */
[data-sec="home"]{--sec:var(--c-saffron);--sec-soft:var(--s-saffron)}
[data-sec="academy"]{--sec:var(--c-teal);--sec-soft:var(--s-teal)}
[data-sec="wiki"]{--sec:var(--c-sky);--sec-soft:var(--s-sky)}
[data-sec="library"]{--sec:var(--c-rose);--sec-soft:var(--s-rose)}
[data-sec="review"]{--sec:var(--thread);--sec-soft:var(--thread-soft)}
[data-sec="graph"]{--sec:var(--c-leaf);--sec-soft:var(--s-leaf)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.75 var(--f-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;line-height:1.4;text-wrap:balance}
h1{font-size:var(--t-3xl);line-height:1.3}
h2{font-size:var(--t-2xl)}
h3{font-size:var(--t-xl)}
h4{font-size:var(--t-l)}
p{margin:0}
a{color:inherit;text-decoration-color:var(--thread);text-underline-offset:.28em;text-decoration-thickness:2px}
a:hover{color:var(--thread-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
::selection{background:var(--c-saffron);color:#14283A}
bdi,[dir="auto"]{unicode-bidi:plaintext}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.read{font-family:var(--f-read);font-size:1.2rem;line-height:2.05}
.lead{font-family:var(--f-read);font-size:1.3rem;line-height:1.95;color:var(--ink)}
.eyebrow{font-size:var(--t-xs);letter-spacing:.04em;color:var(--ink-2);font-weight:500}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);border:0;border-radius:var(--r-s);padding:.6rem 1rem}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* عناصر تستقبل التركيز برمجياً عند تغيّر الصفحة، وليست تفاعلية */
[tabindex="-1"]:focus{outline:0}
/* ───── الهيكل العام ───── */
#app{min-height:100vh;--top-h:64px}
.wrap{width:100%;max-width:76rem;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:block;outline:0}
#view{padding-block:var(--sp-5) calc(7rem + env(safe-area-inset-bottom,0px))}
#view>*+*{margin-top:var(--sp-6)}

/* ───── الترويسة: خيط وخرزات ───── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);height:var(--top-h)}
.top::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--thread);opacity:.9}
.top-in{height:100%;display:flex;align-items:center;gap:var(--sp-4)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);flex:none;min-height:44px}
.brand:hover{color:var(--ink)}
.brand-mark{width:34px;height:34px;display:block}
.brand-name{font:700 1.55rem/1 var(--f-display)}
.brand-latin{font:600 .72rem/1 var(--f-ui);letter-spacing:.22em;color:var(--ink-2);margin-top:.2rem}
.tnav{display:none;flex:1;min-width:0;height:100%}
.tnav ul{display:flex;justify-content:center;height:100%}
.tnav a{position:relative;display:flex;align-items:center;gap:.4rem;height:100%;padding-inline:clamp(.6rem,1.4vw,1.1rem);
  text-decoration:none;font-size:var(--t-s);font-weight:500;color:var(--ink-2)}
.tnav a:hover{color:var(--ink)}
.tnav a::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--b);border:2px solid var(--paper);box-sizing:content-box;transition:transform .18s ease}
.tnav a:hover::after{transform:scale(1.35)}
.tnav a[aria-current="page"]{color:var(--ink);font-weight:600}
.tnav a[aria-current="page"]::after{transform:scale(1.7);box-shadow:0 0 0 2px var(--ink)}
.tnav .ic{width:20px;height:20px}
.tools{display:flex;gap:.25rem;margin-inline-start:auto;flex:none}
.tbtn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;
  background:transparent;color:var(--ink)}
.tbtn:hover{background:var(--paper-2)}
.tbtn .ic{width:22px;height:22px}
.tbtn kbd{display:none}
.badge{position:absolute;top:2px;inset-inline-end:0;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--thread);
  color:#fff;font:600 .72rem/20px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums}
[data-theme="dark"] .badge{color:#14283A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#14283A}}

/* ───── الشريط السفلي للهاتف ───── */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 0 var(--line)}
.dock::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:var(--thread);opacity:.9}
.dock ul{display:grid;grid-template-columns:repeat(5,1fr);max-width:40rem;margin-inline:auto;
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:62px;
  padding:14px 2px 7px;text-decoration:none;font-size:var(--t-xs);font-weight:500;color:var(--ink-2)}
.dock a .ic{width:24px;height:24px}
.dock a::before{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--b);border:2px solid var(--paper);box-sizing:content-box;transition:transform .18s ease}
.dock a[aria-current="page"]{color:var(--ink);font-weight:600}
.dock a[aria-current="page"]::before{transform:scale(1.55);box-shadow:0 0 0 2px var(--ink)}
.dock .badge{top:8px;inset-inline-end:calc(50% - 26px)}

@media (min-width:880px){
  .tnav{display:block}
  .dock{display:none}
  #view{padding-block:var(--sp-6) var(--sp-7)}
  .tbtn kbd{display:inline;position:absolute;bottom:-1px;inset-inline-start:50%;transform:translateX(50%);font:500 .625rem/1 var(--f-ui);color:var(--ink-2)}
}
@media (max-width:420px){.brand-latin{display:none}}

/* ───── رأس الصفحة ───── */
.phead{display:grid;gap:var(--sp-3);max-width:46rem}
.phead .eyebrow{display:flex;align-items:center;gap:.5rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--b,var(--sec));flex:none}
.phead p{color:var(--ink-2);font-size:var(--t-l);line-height:1.8}
.threadline{height:14px;margin-block:var(--sp-2) 0;
  background:radial-gradient(circle at 7px 7px,var(--sec) 6px,transparent 6.6px) 100% 0/14px 14px no-repeat,
             linear-gradient(var(--thread),var(--thread)) 0 6px/100% 2px no-repeat}
.back{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;color:var(--ink-2);text-decoration:none;font-size:var(--t-s)}
.back:hover{color:var(--ink)}
.back .ic{width:18px;height:18px}
.tnav .ic{display:none}
@media (min-width:1120px){.tnav .ic{display:block}}
/* ───── خريزة ───── */
.mascot{display:block;width:100%;height:auto;overflow:visible}
.m-thread{fill:none;stroke:var(--thread);stroke-width:4;stroke-linecap:round}
.m-thread-f{fill:var(--thread)}.m-sky-f{fill:var(--c-sky)}
.m-body{fill:var(--m-body);stroke:var(--m-ink);stroke-width:3.4;stroke-linejoin:round}
.m-shine{fill:none;stroke:var(--m-shine);stroke-width:4;stroke-linecap:round;opacity:.6}
.m-shine-f{fill:var(--m-shine)}.m-fill{fill:var(--m-ink)}.m-cheek-f{fill:var(--m-cheek)}
.m-line{fill:none;stroke:var(--m-ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.brand-mark .m-body{stroke-width:2.4}.brand-mark .m-thread{stroke-width:3}
.eye{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .eye{animation:blink 6s infinite}
  .hero-buddy .mascot{animation:bob 5s ease-in-out infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes drop{from{transform:translateY(-14px);opacity:0}}
  @keyframes pop{from{transform:translateY(10px);opacity:0}}
  .sb{animation:drop .5s both}
  .toast{animation:pop .22s}
}

/* ───── أزرار وشارات ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.55rem 1.2rem;border-radius:999px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:var(--t-s);line-height:1.3;text-decoration:none;transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{background:var(--paper-2);color:var(--ink)}
.btn:active{transform:translateY(0)}
.btn .ic{width:18px;height:18px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 var(--thread);transform:translateY(-2px)}
.btn.quiet{border-color:transparent;color:var(--ink-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-fg)}
.btn.danger-q{border-color:var(--thread-ink);color:var(--thread-ink)}
.btn.sm{min-height:44px;padding:.3rem .9rem;font-size:var(--t-xs)}
.btn.big-btn{min-height:58px;padding:1rem 2rem;font-size:var(--t-l)}
kbd{font:500 .72rem/1 var(--f-ui);padding:.12rem .4rem;border:1px solid currentColor;border-radius:5px;opacity:.7}
@media (hover:none){kbd{display:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:30px;padding:.1rem .75rem;border-radius:999px;background:var(--paper-2);color:var(--ink);
  border:1.5px solid transparent;font-size:var(--t-xs);font-weight:500;text-decoration:none;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--b);flex:none}
.chip .ic{width:14px;height:14px}
.chip.sample{background:var(--s-saffron);border-color:var(--c-saffron)}
.chip.ok{background:var(--s-teal);border-color:var(--c-teal)}
.chip.due{background:var(--thread-soft);color:var(--thread-ink);font-weight:600}
.chip.link{min-height:40px;font-size:var(--t-s);background:var(--card);border-color:var(--line)}
.chip.link:hover{border-color:var(--ink)}
.btn-chip{min-height:44px;padding-inline:1rem;font-size:var(--t-s);background:var(--card);border-color:var(--line);cursor:pointer;font-family:inherit}
.btn-chip:hover{border-color:var(--ink)}
.btn-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-chip.on i{box-shadow:0 0 0 2px var(--paper)}
.bead{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:var(--b);margin-top:.5em;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.35)}
.eyebrow .bead,.ncard-top .bead,.chain .bead,.srow .bead{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.end{justify-content:flex-end;margin-top:var(--sp-4)}
.row.between{justify-content:space-between}
.row.grow{flex:1;flex-wrap:nowrap}
.stack>*+*{margin-top:var(--sp-5)}
.center{text-align:center}.small{font-size:var(--t-xs)}
.err{color:var(--thread-ink);font-weight:500}
.count{margin-block:var(--sp-3)}
.lead-s{font:600 var(--t-xl)/1.5 var(--f-display)}
.big{font:700 clamp(3rem,10vw,5rem)/1 var(--f-display);margin:0}
.big small{font-size:.4em;color:var(--ink-2);font-weight:500}
.warn{display:flex;gap:.7rem;align-items:flex-start;padding:.9rem 1rem;border-radius:var(--r-m);background:var(--thread-soft);margin-bottom:var(--sp-5)}
.warn .ic{flex:none;width:20px;margin-top:.3rem;color:var(--thread-ink)}
.nudge{display:flex;gap:.5rem;align-items:flex-start;color:var(--ink-2);font-size:var(--t-s);margin-top:var(--sp-3)}
.nudge .ic{width:18px;flex:none;margin-top:.3rem}
.notice{padding:.8rem 1rem;border-radius:var(--r-m);background:var(--s-saffron);font-size:var(--t-s);margin-block:1rem}

/* ───── حقول ───── */
.fld{display:grid;gap:.35rem;margin-block:.9rem}
.fld>span{font-weight:600;font-size:var(--t-s)}
.fld small{font-weight:400;color:var(--ink-2)}
.fld2{display:grid;gap:0 1rem}
@media (min-width:560px){.fld2{grid-template-columns:1fr 1fr}}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{width:100%;min-height:48px;padding:.6rem .9rem;border:2px solid var(--line);border-radius:var(--r-s);
  background:var(--card);color:var(--ink);font-size:var(--t-m);line-height:1.6}
input[type=file]{width:100%;min-height:48px;padding:.5rem 0}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,select:focus{border-color:var(--focus)}
::placeholder{color:var(--ink-2);opacity:.8}
.mono{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace!important;direction:ltr;text-align:left}
.searchbox,.hero-q,.sform{display:flex;align-items:center;gap:.6rem;background:var(--card);border:2px solid var(--line);border-radius:999px;padding-inline:1rem 1rem;min-height:54px}
.searchbox{flex:1;max-width:42rem}
.searchbox:focus-within,.hero-q:focus-within,.sform:focus-within{border-color:var(--focus)}
.searchbox input,.hero-q input,.sform input{border:0!important;background:transparent!important;min-height:48px;padding:0 .2rem;outline:0;flex:1;min-width:0}
.searchbox>.ic,.hero-q>.ic,.sform>.ic{width:20px;height:20px;flex:none;color:var(--ink-2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--paper-2);border:0;margin:0;min-width:0}
.wrapseg{border-radius:var(--r-m);display:flex}
.seg-i{position:relative;display:inline-flex}
.seg-i input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg-i span,.seg-b{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:.3rem 1rem;border-radius:999px;font-size:var(--t-s);font-weight:500;color:var(--ink-2);border:0;background:transparent}
.seg-b .ic{width:18px;height:18px}
.seg-i input:checked+span,.seg-b.on{background:var(--ink);color:var(--paper)}
.seg-i input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.tabs{margin-block:var(--sp-4)}
.sw{display:flex;gap:1rem;align-items:flex-start;padding-block:.8rem;cursor:pointer;min-height:48px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:50px;height:30px;border-radius:15px;background:var(--ink-2);border:0;margin:.15rem 0 0;transition:background .2s;cursor:pointer}
.sw input::before{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:inset-inline-start .2s}
.sw input:checked{background:var(--c-teal)}.sw input:checked::before{inset-inline-start:23px}
.sw-t{display:grid;gap:.1rem}.sw-t small{font-size:var(--t-s)}
.ctx{margin-block:.6rem}

/* ═══ المخزن: حالة التطبيق وحفظها محلياً (localStorage) ═══
   كل بيانات المستخدم في كائن واحد S. التغيير يمرّ عبر mutate() ليُحفظ ويُحتسب في عدّاد النسخ الاحتياطي. */
const KEY = 'nasaq:v1';
const blankState = () => ({
  v: 1, created: now(),
  settings: { theme: 'system', mascot: true, sample: true },
  notes: [], links: [], cards: [], courses: [],   // courses: مسارات بناها المستخدم بالذكاء الاصطناعي
  progress: { done: {}, last: {} },
  saved: {},
  activity: [], reviews: [],
  backup: { last: 0, changes: 0 }
});
let S = blankState(), storageOK = true, saveT = null;

function migrate(o) {
  const b = blankState();
  if (!o || typeof o !== 'object') return b;
  const out = Object.assign(b, o);
  out.settings = Object.assign(blankState().settings, o.settings || {});
  out.progress = Object.assign({ done: {}, last: {} }, o.progress || {});
  out.progress.done = out.progress.done || {}; out.progress.last = out.progress.last || {};
  out.backup = Object.assign({ last: 0, changes: 0 }, o.backup || {});
  ['notes', 'links', 'cards', 'activity', 'reviews', 'courses'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  const seen = new Set();   // مسارات تالفة أو مكرّرة تُسقَط بدل أن تكسر الواجهة
  out.courses = out.courses.map(PS.normCourse).filter(c => c && !seen.has(c.id) && seen.add(c.id)).slice(0, 40);
  if (!out.saved || typeof out.saved !== 'object') out.saved = {};
  out.v = 1;
  return out;
}
function loadState() {
  try {
    localStorage.setItem(KEY + ':t', '1'); localStorage.removeItem(KEY + ':t');
    const raw = localStorage.getItem(KEY);
    if (raw) S = migrate(JSON.parse(raw));
  } catch (e) { storageOK = false; }
}
function flush() {
  clearTimeout(saveT); saveT = null;
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; toast('تعذّر الحفظ في المتصفح. خذ نسخة احتياطية الآن.'); }
}
function mutate(fn) {
  fn(S);
  S.backup.changes++;
  clearTimeout(saveT); saveT = setTimeout(flush, 250);
}
function log(type, label, route) {
  S.activity.unshift({ t: now(), type, label, route: route || '' });
  if (S.activity.length > 200) S.activity.length = 200;
}

/* ═══ الفهرس: المحتوى التجريبي المرفق ═══ */
const CAT = { topics: {}, lessons: {}, courses: {} };
function indexCatalog() {
  TOPICS.forEach(t => { CAT.topics[t.id] = t; });
  COURSES.forEach(c => {
    CAT.courses[c.id] = c; c.lessons = [];
    c.units.forEach((u, ui) => u.lessons.forEach(l => { l.course = c.id; l.unit = ui; c.lessons.push(l); CAT.lessons[l.id] = l; }));

/* ═══ المراجعة المتباعدة: خوارزمية بسيطة على نمط SM-2 ═══
   التقييم: 0 ما عرفتها · 1 صعبة · 2 تمام · 3 سهلة
   - ما عرفتها: تعود بعد ١٠ دقائق، وتُصفَّر سلسلة النجاح، ويقلّ معامل السهولة.
   - صعبة: تُزاد الفترة بنسبة ١٫٢ (يوم على الأقل) ويقلّ المعامل قليلاً.
   - تمام: ١ يوم ثم ٣ أيام ثم الفترة × المعامل.
   - سهلة: ٣ أيام ثم الفترة × المعامل × ١٫٣، ويزيد المعامل. */
const SRS = {
  GRADES: [
    { g: 0, name: 'ما عرفتها', key: '1' },
    { g: 1, name: 'صعبة', key: '2' },
    { g: 2, name: 'تمام', key: '3' },
    { g: 3, name: 'سهلة', key: '4' }
  ],
  fresh() { return { reps: 0, lapses: 0, ease: 2.5, interval: 0, due: now(), last: 0 }; },
  /* يعيد الحالة الجديدة للبطاقة بعد التقييم g. t = لحظة المراجعة */
  next(card, g, t) {
    t = t || now();
    let reps = card.reps || 0, lapses = card.lapses || 0, ease = card.ease || 2.5, prev = card.interval || 0, iv;
    if (g === 0) {
      return { reps: 0, lapses: lapses + 1, ease: Math.max(1.3, +(ease - 0.2).toFixed(2)), interval: 0, due: t + 10 * 60e3, last: t };
    }
    if (g === 1) {
      ease = Math.max(1.3, ease - 0.15); reps = Math.max(reps, 1);
      iv = Math.max(1, Math.round((prev || 1) * 1.2));
    } else if (g === 2) {
      reps += 1;
      iv = reps === 1 ? 1 : reps === 2 ? 3 : Math.round(prev * ease);
    } else {
      reps += 1; ease += 0.15;
      iv = reps === 1 ? 3 : Math.round(Math.max(prev, 1) * ease * 1.3);
    }
    if (g >= 2) iv = Math.max(iv, Math.floor(prev) + 1);
    iv = Math.min(365, iv);
    return { reps, lapses, ease: +ease.toFixed(2), interval: iv, due: t + iv * DAY, last: t };
  },
  /* الفترة (بالأيام) التي ستنتج عن كل تقييم، لعرضها على الأزرار */
  preview(card) {
    return [0, 1, 2, 3].map(g => { const n = SRS.next(card, g, 0); return g === 0 ? 10 / 1440 : n.interval; });
  }
};

function searchAll(q) {
  const n = norm(q); if (!n) return null;
  const rank = (title, text) => norm(title).includes(n) ? 0 : (norm(text).includes(n) ? 1 : 9);
  const out = { topics: [], lessons: [], notes: [] };
  if (sampleOn()) TOPICS.forEach(t => { const r = rank(t.t, t.def + ' ' + t.body.join(' ')); if (r < 9) out.topics.push([r, t]); });
  visibleLessons().filter(lessonReady).forEach(l => { const r = rank(l.t, l.blocks.map(b => Array.isArray(b[1]) ? b[1].join(' ') : b[1]).join(' ')); if (r < 9) out.lessons.push([r, l]); });
  S.notes.forEach(x => { const r = rank(noteTitle(x), (x.body || '') + ' ' + (x.tags || []).join(' ') + ' ' + (x.src && x.src.label || '')); if (r < 9) out.notes.push([r, x]); });
  Object.keys(out).forEach(k => { out[k] = out[k].sort((a, b) => a[0] - b[0]).map(x => x[1]); });
  return out;
}

const PS = (() => {
  const PAL = ['learning', 'thinking', 'science', 'history', 'math'];       // ألوان المجالات الموجودة، تُوزَّع على المسارات

function continueCourse() {
  const vis = visibleCourses();
  const last = S.progress.lastLesson && CAT.lessons[S.progress.lastLesson];
  let c = last ? CAT.courses[last.course] : null;
  if (c && (!vis.includes(c) || !nextLesson(c))) c = null;
  return c || vis.find(x => courseDone(x) > 0 && nextLesson(x)) || null;
}

const totalMin = c => c.lessons.reduce((s, l) => s + (l.min || 0), 0);
const aiBadge = () => `<span class="chip ai" title="كتبه الذكاء الاصطناعي ولم يراجعه محرر">ذكاء اصطناعي</span>`;
const originBadge = c => c.user ? aiBadge() : sampleBadge();

/* ───── مصادر مقترحة (كتب وفيديوهات) ─────
   النموذج قد يخطئ بالعناوين، فلا نعرض منه أي رابط: الزر يفتح بحثاً نبنيه نحن (يوتيوب أو Google Books أو الويب). */
const RES_C = { book: 'var(--c-sky)', video: 'var(--c-rose)', course: 'var(--c-leaf)', site: 'var(--c-saffron)' };
const resUrl = r => {
  const q = encodeURIComponent((r.t + ' ' + (r.by || '')).trim());
  return r.k === 'video' ? 'https://www.youtube.com/results?search_query=' + q : (r.k === 'book' ? 'https://www.google.com/search?tbm=bks&q=' + q : 'https://www.google.com/search?q=' + q);
};
const resLabel = r => r.k === 'video' ? 'ابحث في يوتيوب' : (r.k === 'book' ? 'ابحث عن الكتاب' : 'ابحث في الويب');
const resSaved = r => S.notes.some(n => n.type === 'source' && n.title === r.t);
function resItem(r, key) {
  return `<li class="resi" style="--b:${RES_C[r.k] || RES_C.site}"><div class="resi-m"><span class="chip"><i></i>${PS.RES_KINDS[r.k] || 'مصدر'}</span>

const RES_NOTE = 'هذي اقتراحات من الذكاء الاصطناعي وقد يخطئ بالعناوين أو أسماء المؤلفين. الزر يفتح بحثاً عن المصدر (يوتيوب أو Google Books أو الويب) ولا يفتح صفحة محددة، فتأكد أنه موجود قبل ما تعتمد عليه.';
function courseRes(c) {

  if (!c.units.length || busy) return '';

function lessonRefs(l) {

A['res-save'] = d => {
  const [t, id, i] = String(d.k || '').split(':'); let r, c, l = null;

function renderBlocks(bl) {
  return bl.map(([t, x]) => {
    if (t === 'h') return `<h3>${inline(x)}</h3>`;

    if (t === 'note') return `<aside class="callout"><span class="callout-t">${ic('bolt')} فكرة</span><p>${inline(x)}</p></aside>`;
    if (t === 'ul') return `<ul class="rlist">${x.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`;

/* ═══ شبكة المعرفة: العقد والروابط التي صنعها المستخدم فقط ═══ */
const GR = { view: null, sel: null };
const grView = () => GR.view || (innerWidth < 700 ? 'list' : 'map');

function graphData() {
  const map = new Map(), edges = [];
  const add = r => { const x = resolve(r); if (!x) return null; x.key = x.kind + ':' + x.id; if (!map.has(x.key)) map.set(x.key, x); return map.get(x.key); };
  S.notes.forEach(n => add({ kind: 'note', id: n.id }));
  Object.keys(S.saved).forEach(id => add({ kind: 'topic', id }));
  S.links.forEach(l => { const a = add(l.a), b = add(l.b); if (a && b) edges.push({ id: l.id, a: a.key, b: b.key, label: l.label }); });
  const deg = new Map(); edges.forEach(e => { deg.set(e.a, (deg.get(e.a) || 0) + 1); deg.set(e.b, (deg.get(e.b) || 0) + 1); });
  const nodes = [...map.values()]; nodes.forEach(n => { n.deg = deg.get(n.key) || 0; });
  return { nodes, edges };
}

/* توزيع بسيط بالقوى: تنافر بين العقد وشدّ على الروابط. حتمي (بلا عشوائية) فتبقى الخريطة ثابتة. */
function forceLayout(nodes, edges, W, H) {
  const n = nodes.length; if (!n) return;
  nodes.forEach((p, i) => { const a = i / n * Math.PI * 2; p.x = W / 2 + Math.cos(a) * W * .3; p.y = H / 2 + Math.sin(a) * H * .3; p.vx = 0; p.vy = 0; });
  const by = new Map(nodes.map(p => [p.key, p]));
  for (let it = 0; it < 260; it++) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; if (!dx && !dy) { dx = .5; dy = .5; }
      const d2 = Math.max(dx * dx + dy * dy, 60), d = Math.sqrt(d2), f = 14000 / d2;
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
    edges.forEach(e => {
      const a = by.get(e.a), b = by.get(e.b), dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 150) * .03;
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
    });
    nodes.forEach(p => {
      p.vx += (W / 2 - p.x) * .012; p.vy += (H / 2 - p.y) * .012;
      p.x = Math.max(80, Math.min(W - 80, p.x + p.vx)); p.y = Math.max(44, Math.min(H - 54, p.y + p.vy)); p.vx *= .82; p.vy *= .82;
    });
  }
}

function graphSVG(g) {
  const W = 800, H1 = 460, conn = g.nodes.filter(n => n.deg), iso = g.nodes.filter(n => !n.deg);
  const per = 6, rows = Math.ceil(iso.length / per), H = H1 + (iso.length ? rows * 78 + 46 : 0);
  forceLayout(conn, g.edges, W, H1);
  iso.forEach((n, i) => { const row = Math.floor(i / per), inRow = Math.min(per, iso.length - row * per), gap = (W - 160) / (per - 1); n.x = W / 2 + ((inRow - 1) / 2 - (i % per)) * gap; n.y = H1 + 62 + row * 78; });  // صف متوسّط، الأول من اليمين
  const by = new Map(g.nodes.map(n => [n.key, n]));
  const edges = g.edges.map(e => {
    const a = by.get(e.a), b = by.get(e.b), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const cx = mx - dy / d * 22, cy = my + dx / d * 22, lx = .25 * a.x + .5 * cx + .25 * b.x, ly = .25 * a.y + .5 * cy + .25 * b.y;
    return `<path class="ge" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}"/>${e.label ? `<text class="gl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(excerpt(e.label, 16))}</text>` : ''}`;
  }).join('');
  const nodes = g.nodes.map(n => {
    const r = 15 + Math.min(n.deg, 4) * 2.5;
    return `<g class="gn${GR.sel === n.key ? ' sel' : ''}${n.deg ? '' : ' lone'}" tabindex="0" role="button" data-act="gr-sel" data-key="${esc(n.key)}" aria-label="${esc(n.label + ': ' + n.title)}"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${n.color}"/><text x="${n.x.toFixed(1)}" y="${(n.y + r + 18).toFixed(1)}" text-anchor="middle">${esc(excerpt(n.title, 20))}</text></g>`;
  }).join('');
  const sep = iso.length ? `<line class="gsep" x1="40" x2="${W - 40}" y1="${H1 + 10}" y2="${H1 + 10}"/><text class="gcap" x="${W / 2}" y="${H1 + 34}" text-anchor="middle">غير مربوطة بعد</text>` : '';
  return `<div class="gmap"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="خريطة شبكة المعرفة">${sep}${edges}${nodes}</svg></div>`;
}

function graphList(g) {
  const by = new Map(g.nodes.map(n => [n.key, n])), iso = g.nodes.filter(n => !n.deg);
  const chain = e => { const a = by.get(e.a), b = by.get(e.b); return `<li class="chain"><a href="#${a.route}">${bead(a.color)}<b dir="auto">${esc(a.title)}</b></a><span class="rel-l" dir="auto">${esc(e.label || 'مرتبط بـ')}</span><a href="#${b.route}">${bead(b.color)}<b dir="auto">${esc(b.title)}</b></a><button class="tbtn sm" data-act="link-del" data-id="${e.id}" aria-label="حذف الرابط">${ic('x')}</button></li>`; };
  return (g.edges.length ? `<ul class="chains">${g.edges.map(chain).join('')}</ul>` : '')
    + (iso.length ? `<section class="blk-s"><h3>غير مربوطة بعد</h3><div class="chips">${iso.map(n => `<a class="chip link" href="#${n.route}" style="--b:${n.color}"><i></i><span dir="auto">${esc(excerpt(n.title, 28))}</span></a>`).join('')}</div></section>` : '');
}

function graphDetail(g) {
  const n = g.nodes.find(x => x.key === GR.sel);
  if (!n) return '';
  const ls = linksOf({ kind: n.kind, id: n.id });
  return `<section class="gdetail" style="--b:${n.color}"><div class="row between"><div><span class="eyebrow">${bead(n.color)} ${n.label}</span><h3 dir="auto">${esc(n.title)}</h3></div><button class="tbtn sm" data-act="gr-sel" data-key="" aria-label="إغلاق التفاصيل">${ic('x')}</button></div>
    ${ls.length ? `<ul class="nrows">${ls.map(x => `<li><a href="#${x.other.route}">${bead(x.other.color)}<span><b dir="auto">${esc(x.other.title)}</b><small class="muted" dir="auto">${x.link.label ? esc(x.link.label) : 'مرتبط'}</small></span></a></li>`).join('')}</ul>` : '<p class="muted">ما اكو روابط على هالعقدة بعد.</p>'}
    <div class="row"><a class="btn primary" href="#${n.route}">فتح ${ic('next')}</a><button class="btn" data-act="link-new" data-k="${n.kind}" data-i="${esc(n.id)}">${ic('link')} اربطه بفكرة</button></div></section>`;
}

/* ═══ مساحة التقدم: أرقام من نشاطك الفعلي فقط ═══ */
function reviewDays(n) {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const out = []; for (let i = n - 1; i >= 0; i--) out.push({ t: t0.getTime() - i * DAY, n: 0 });
  S.reviews.forEach(r => { const d = new Date(r.t); d.setHours(0, 0, 0, 0); const b = out.find(x => x.t === d.getTime()); if (b) b.n++; });
  return out;
}
const activeDays = () => new Set(S.reviews.map(r => { const d = new Date(r.t); d.setHours(0, 0, 0, 0); return d.getTime(); })).size;

function reviewChart(days) {
  const W = 560, H = 176, pl = 38, pr = 8, pt = 12, pb = 28, max = Math.max(...days.map(d => d.n), 1), top = max <= 5 ? 5 : Math.ceil(max / 5) * 5;
  const bw = (W - pl - pr) / days.length, ch = H - pt - pb, y = v => pt + ch - v / top * ch;
  const bars = days.map((d, i) => {
    const x = W - pr - (i + 1) * bw + bw * .2, h = d.n / top * ch, today = i === days.length - 1, dd = new Date(d.t).getDate();
    return `<rect class="cb${today ? ' today' : ''}" x="${x.toFixed(1)}" y="${(pt + ch - h).toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${Math.max(h, d.n ? 2 : 0).toFixed(1)}" rx="3"><title>${fmtDate(d.t)}: ${d.n}</title></rect>`
      + (i % 2 === days.length % 2 || today ? `<text x="${(x + bw * .3).toFixed(1)}" y="${H - 8}" text-anchor="middle"${today ? ' class="b"' : ''}>${dd}</text>` : '');
  }).join('');
  return `<svg class="cx" viewBox="0 0 ${W} ${H}" role="img" aria-label="عدد المراجعات في كل يوم خلال آخر ${days.length} يوماً">
    <line class="cg" x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}"/><line class="cg" x1="${pl}" x2="${W - pr}" y1="${y(top)}" y2="${y(top)}"/>

قيم k المسموحة فقط: book, video, course, site.`;

/* ───── المشغّل ───── */
const findStored = (s, lid) => { for (const c of s.courses) for (const u of c.units) for (const l of u.lessons) if (l.id === lid) return l; return null; };
const onCourse = cid => cur && cur.name === 'course' && cur.id === cid;
const stageUnits = (units, cid) => { let k = 0; return units.map(u => ({ t: u.t, goal: u.goal, lessons: u.lessons.map(l => ({ id: cid + '-' + (++k), t: l.t, brief: l.brief, min: l.min, ok: false, blocks: [], cards: [], topics: [] })) })); };

function genStop() { if (GEN.busy) { GEN.stop = true; try { GEN.ctl.abort(); } catch (e) { } } }
A['gen-stop'] = () => genStop();

async function runBuild(cid, only, regen) {
  if (GEN.busy || !S.courses.some(x => x.id === cid)) return;
  Object.assign(GEN, { busy: true, cid, ctl: new AbortController(), stop: false, err: '', fails: 0, fin: 0, total: 0 });
  GEN.active.clear();
  GEN.phase = S.courses.find(x => x.id === cid).units.length ? 'lessons' : 'outline';
  paintGen();
  try {
    if (GEN.phase === 'outline') {
      const c = S.courses.find(x => x.id === cid);
      const raw = await AI.ask(outlinePrompt(c.spec), { json: true, signal: GEN.ctl.signal, command: 'build-path-outline', label: c.title });
      const r = PS.outline(raw, PS.SIZES[c.spec.size].n);
      if (r.err) throw { code: r.err };
      mutate(s => { const x = s.courses.find(y => y.id === cid); if (x) Object.assign(x, { sub: r.data.sub, desc: r.data.desc, res: r.data.res, units: stageUnits(r.data.units, cid) }); });
      indexUserCourses();
      /* النموذج أحياناً ينسى حقل المصادر بالمخطط: نطلبها بطلب مستقل صغير بدل ما نترك المسار بلا مصادر (الفشل هنا لا يوقف البناء) */
      if (!r.data.res.length && !GEN.stop) {
        GEN.phase = 'res'; paintGen();
        try {
          const v = CAT.courses[cid];
          const raw2 = await AI.ask(resPrompt(v), { json: true, signal: GEN.ctl.signal, tier: 'quick', command: 'suggest-resources', label: v.title });
          const r2 = PS.resOnly(raw2);
          if (!r2.err) { mutate(s => { const x = s.courses.find(y => y.id === cid); if (x) x.res = r2.res; }); indexUserCourses(); }
        } catch (e2) { if (e2 && e2.code === 'cancelled') GEN.stop = true; }
      }
      GEN.phase = 'lessons';
      if (onCourse(cid)) rerender();
    }
    if (!GEN.stop) await writeLessons(cid, only, regen);
  } catch (e) {
    const code = (e && e.code) || 'upstream_error';
    if (code === 'cancelled') GEN.stop = true; else GEN.err = GEN.err || code;
  }
  GEN.busy = false; GEN.phase = '';
  finishBuild(cid);
}

async function writeLessons(cid, only, regen) {
  const v = CAT.courses[cid]; if (!v) return;
  const queue = v.lessons.filter(l => only ? only.includes(l.id) : !l.ok).map(l => l.id);
  GEN.total = queue.length; GEN.fin = 0;
  const worker = async () => { while (queue.length && !GEN.stop && !GEN.err) await writeOne(cid, queue.shift(), !!regen); };
  await Promise.all(Array.from({ length: Math.min(AI.concurrency(), queue.length) }, worker));
}

async function writeOne(cid, lid, regen) {
  const v = CAT.courses[cid], l = CAT.lessons[lid]; if (!v || !l) return;
  GEN.active.add(lid); paintGen(); if (cur.name === 'lesson' && cur.id === lid) rerender();
  try {
    const raw = await AI.ask(lessonPrompt(v, l, AI.lite()), { json: true, signal: GEN.ctl.signal, command: 'build-path-lesson', label: l.t });
    const r = PS.lesson(raw); if (r.err) throw { code: r.err };
    if (GEN.stop) throw { code: 'cancelled' };
    mutate(s => { const x = findStored(s, lid); if (x) { Object.assign(x, { blocks: r.blocks, cards: r.cards, refs: r.refs, min: r.min, ok: true }); delete x.err; } });
    GEN.fails = 0;
  } catch (e) {
    const code = (e && e.code) || 'upstream_error';
    if (code !== 'cancelled') {
      if (l.ok) toast(AI.errText(code));                       // إعادة كتابة فاشلة: القديم يبقى كما هو
      else mutate(s => { const x = findStored(s, lid); if (x) x.err = code; });
      if (AI.FATAL.has(code)) { GEN.err = GEN.err || code; try { GEN.ctl.abort(); } catch (z) { } }   // لا فائدة من تكرار الطلب
      else if (++GEN.fails >= 3) { GEN.err = 'repeated'; try { GEN.ctl.abort(); } catch (z) { } }
    }
  } finally {
    GEN.active.delete(lid); GEN.fin++; paintGen();
    if (cur.name === 'lesson' && cur.id === lid) rerender();
  }
}

function finishBuild(cid) {
  const v = CAT.courses[cid], pend = v ? v.lessons.filter(l => !lessonReady(l)).length : 0;
  if (v && v.lessons.length && !pend && !GEN.err && !GEN.stop) {
    mutate(() => log('course', 'اكتمل بناء مسار: ' + v.title, 'course-' + cid));
    toast('اكتمل بناء «' + v.title + '».', { act: 'فتح', fn: () => go('course-' + cid) });
  } else if (GEN.stop) toast('أوقفت البناء. تكدر تكمّله بأي وقت من صفحة المسار.');
  else if (v && GEN.err) toast(AI.errText(GEN.err));
  if (onCourse(cid)) rerender();
}

/* اقتراح مصادر (كتب وفيديوهات) لمسار موجود: طلب واحد */
async function runRes(cid) {

    toast(code === 'cancelled' ? 'أوقفت اقتراح المصادر.' : AI.errText(code));

}

/* ═══ إعدادات: نماذج الذكاء الاصطناعي ═══
   يضيف المستخدم نموذجاً بمفتاح API (OpenAI-compatible، Anthropic، Gemini) أو خادماً محلياً (Ollama، LM Studio) أو نموذجاً داخل المتصفح (WebGPU).
   الإعدادات والمفاتيح في مخزن مستقل (انظر 23-ai.js) ولا تدخل النسخ الاحتياطي. */
const presetById = id => AI.PRESETS.find(p => p.id === id) || AI.PRESETS[0];
const presetOf = m => m.kind === 'webllm' ? 'webllm' : ((AI.PRESETS.find(p => p.kind === m.kind && p.base && p.base.replace(/\/+$/, '') === m.base) || {}).id || (m.kind === 'openai' ? 'custom' : m.kind));
const hostOf = u => { try { return new URL(u).host; } catch (e) { return u; } };

function aiSection() {

      <div class="row"><button class="btn sm" data-act="ai-edit" data-id="${esc(m.id)}">${ic('edit')} تعديل</button><button class="btn sm quiet" data-act="ai-del" data-id="${esc(m.id)}" aria-label="حذف ${esc(m.name)}">${ic('trash')} حذف</button></div></li>`).join('');
  return `<section id="ai-models"><h2>نماذج الذكاء الاصطناعي</h2>
    <p class="muted">المستخدم الآن: <b>${esc(AI.label())}</b>. يبني نَسَق المسارات ويجيب المساعد بالنموذج اللي تختاره هنا. تكدر تضيف نموذجاً بمفتاح API، أو خادماً يشتغل على جهازك، أو نموذجاً يشتغل داخل المتصفح.</p>
    ${IN_VIEWER ? `<p class="notice"><b>تنبيه:</b> أنت تفتح نَسَق داخل منصة عرض تحجب الاتصال بأي موقع خارجها، فالنماذج المضافة هنا (API أو محلية) <b>ما راح تتصل</b>. هذا القسم يشتغل لما تفتح نَسَق كملف مستقل أو على استضافتك. داخل المنصة يشتغل Claude تلقائياً بدون مفتاح.</p>` : ''}
    <ul class="aim-list" role="radiogroup" aria-label="النموذج المستخدم">
      <li class="aim"><label class="aim-r"><input type="radio" name="aimodel" data-change="aimodel" value="auto"${!act ? ' checked' : ''}><span class="aim-t"><b>تلقائي</b><small class="muted">${auto ? 'يستخدم: ' + esc(auto) : 'ما اكو مصدر متاح حالياً. أضف نموذجاً.'}</small></span></label></li>
      ${rows}</ul>
    <div class="row"><button class="btn primary" data-act="ai-add"${AIC.list.length >= 8 ? ' disabled' : ''}>${ic('plus')} أضف نموذجاً</button></div>
    <p class="muted small">المفاتيح تنحفظ نصاً عادياً في هذا المتصفح فقط، ولا تدخل النسخة الاحتياطية، ولا تُرسل إلا للعنوان اللي تحدده. لا تضيفها على جهاز مشترك، واستعمل مفتاحاً بحد صرف أو صلاحيات محدودة. التكلفة تُحسب عند المزوّد حسب تسعيرته، وبعضهم يقدّم أسعاراً منخفضة أو مستوى مجانياً، فراجع صفحة الأسعار عندهم.</p></section>`;
}

function openAiDialog(id) {

    <div class="row f-list"><button type="button" class="btn sm" data-act="ai-list">${ic('list')} اجلب النماذج المتاحة</button><small class="muted" id="ai-list-res" aria-live="polite"></small></div>

    <label class="fld f-key"><span>مفتاح API <small id="ai-keyreq"></small></span><input name="key" type="password" dir="ltr" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="${m && m.key ? 'اتركه فارغاً ليبقى المفتاح الحالي (' + esc(aiMask(m.key)) + ')' : ''}"></label>
    <label class="fld"><span>اسم للعرض <small>اختياري</small></span><input name="name" maxlength="60" dir="auto" autocomplete="off" value="${m ? esc(m.name) : ''}"></label>
    <details class="ctx"><summary>خيارات متقدمة</summary><label class="fld"><span>الحد الأقصى للرموز بكل رد <small>اختياري. ارفعه إذا الدروس تنقطع</small></span><input name="max" type="number" min="256" max="64000" step="1" inputmode="numeric" dir="ltr" value="${m && m.max ? m.max : ''}"></label></details>
    <div id="ai-test-res" aria-live="polite"></div>
    <div class="row end"><button type="button" class="btn quiet" data-act="dlg-close">إلغاء</button><button type="button" class="btn" data-act="ai-test">جرّب الاتصال</button><button class="btn primary" type="submit">${m ? 'احفظ التعديل' : 'احفظ واستخدمه'}</button></div></form>`,
    { label: m ? 'تعديل نموذج' : 'إضافة نموذج', sheet: true });
  const f = $('form[data-form="aimodel"]'); if (f) syncAiForm(f, true);

function syncAiForm(f, init) {
  const pr = presetById(f.elements.preset.value), web = pr.kind === 'webllm', show = (c, on) => { const e = $(c, f); if (e) e.hidden = !on; };
  show('.f-base', !web); show('.f-model', !web); show('.f-list', !web); show('.f-web', web); show('.f-key', !web && pr.key !== 'none');
  const keyReq = $('#ai-keyreq', f); if (keyReq) keyReq.textContent = pr.key === 'req' ? 'مطلوب' : 'اختياري';
  if (!init && !web) f.elements.base.value = pr.base || '';
  if (init && !f.dataset.id && !web && !f.elements.base.value) f.elements.base.value = pr.base || '';
  const warn = web && !navigator.gpu ? ' ⚠ متصفحك الحالي ما يدعم WebGPU، فما راح يشتغل هذا الخيار هنا.' : '';
  if (f.elements.model && !web) f.elements.model.placeholder = pr.ph || 'كما يظهر عند المزوّد'; const dl = $('#ai-dl', f); if (dl && !init) dl.innerHTML = '';
  const h = $('#ai-hint', f); if (h) h.textContent = (pr.hint || '') + warn;
}
ON.aipreset = t => syncAiForm(t.form, false);

/* يقرأ حقول النموذج ويرجع { cfg } أو { err } */
function aiFormCfg(f, ex) {
  const fd = new FormData(f), pr = presetById(fd.get('preset')), web = pr.kind === 'webllm';
  let key = web ? '' : String(fd.get('key') || '').replace(/\s+/g, '');
  const model = web ? String(fd.get('webmodel') || '') : String(fd.get('model') || '').trim().replace(/\s+/g, '');
  const base = web ? '' : String(fd.get('base') || '').trim();
  if (!web) {
    if (!base) return { err: 'اكتب عنوان الخدمة.', f: 'base' };
    let u; try { u = new URL(base); if (!/^https?:$/.test(u.protocol)) throw 0; } catch (e) { return { err: 'عنوان الخدمة غير صالح. لازم يبدأ بـ http أو https.', f: 'base' }; }
    if (location.protocol === 'https:' && u.protocol === 'http:' && !isLocalHost(u.hostname)) return { err: 'المتصفح يمنع الاتصال بعنوان http من صفحة https. استخدم عنوان https.', f: 'base' };
    if (!key && ex && ex.kind === pr.kind && ex.base === u.href.replace(/\/+$/, '')) key = ex.key;   // نبقي المفتاح القديم فقط إذا بقي العنوان نفسه
  }
  if (!model) return { err: web ? 'اختر نموذجاً.' : 'اكتب اسم النموذج. إذا ما تعرفه اضغط «اجلب النماذج المتاحة».', f: 'model' };
  if (pr.key === 'req' && !key) return { err: 'هذا المزوّد يحتاج مفتاح API. الصقه بخانة المفتاح.', f: 'key' };
  const wl = web ? AI.WEB.find(x => x[0] === model) : null;
  const name = PS.clean(fd.get('name'), 60) || (web ? 'داخل المتصفح · ' + (wl ? wl[1] : model) : (pr.id === 'custom' ? hostOf(base) : pr.name) + ' · ' + model);
  const cfg = aiNorm({ id: ex ? ex.id : uid('m'), kind: pr.kind, base, model, key, name, max: fd.get('max') });
  return cfg ? { cfg } : { err: 'بيانات النموذج غير صالحة. راجع العنوان والاسم.' };
}

function aiShowErr(f, r) {
  const box = $('#ai-test-res'); if (box) box.innerHTML = `<p class="err" role="alert">${esc(r.err)}</p>`;
  const el = r.f && f.elements[r.f]; if (el) { try { el.focus(); el.setAttribute('aria-invalid', 'true'); el.addEventListener('input', () => el.removeAttribute('aria-invalid'), { once: true }); } catch (e) { } }
}
A['ai-add'] = () => { if (AIC.list.length >= 8) { toast('وصلت الحد الأقصى (٨ نماذج). احذف نموذجاً قديماً.'); return; } openAiDialog(''); };
A['ai-edit'] = d => openAiDialog(d.id);
A['ai-del'] = async d => {
  const m = AIC.list.find(x => x.id === d.id); if (!m) return;
  if (!await confirmDlg({ title: 'حذف النموذج؟', text: `ينحذف «${m.name}» ومفتاحه من هذا المتصفح. ما يتأثر شي ثاني.`, ok: 'احذف', danger: true })) return;
  AIC.list = AIC.list.filter(x => x.id !== m.id); if (AIC.active === m.id) AIC.active = 'auto';
  aiSave(); toast('انحذف النموذج.'); rerender();
};
FORMS.aimodel = f => {
  const ex = f.dataset.id ? AIC.list.find(x => x.id === f.dataset.id) : null;
  const r = aiFormCfg(f, ex); if (r.err) { aiShowErr(f, r); return; }
  if (!ex && AIC.list.length >= 8) { toast('وصلت الحد الأقصى (٨ نماذج).'); return; }
  if (ex) AIC.list = AIC.list.map(x => x.id === ex.id ? r.cfg : x); else { AIC.list.push(r.cfg); AIC.active = r.cfg.id; }
  const saved = aiSave();
  closeDlg(); toast(saved ? (ex ? 'انحفظ التعديل.' : 'انضاف النموذج وصار هو المستخدم. جرّب بناء مسار.') : 'انضاف للجلسة الحالية بس، لأن المتصفح ما يسمح بالحفظ.'); rerender();
};
A['ai-test'] = async (d, btn) => {
  const f = btn.closest('form'), ex = f.dataset.id ? AIC.list.find(x => x.id === f.dataset.id) : null, box = $('#ai-test-res');
  const r = aiFormCfg(f, ex); if (r.err) { aiShowErr(f, r); return; }
  const web = r.cfg.kind === 'webllm'; btn.disabled = true;
  box.innerHTML = `<p class="muted">${web ? 'نحمّل النموذج ونجرّبه. أول مرة ياخذ دقائق حسب حجمه وسرعة النت.' : 'نجرّب الاتصال…'}</p>${web ? '<div class="gbar det" aria-hidden="true"><i style="width:0"></i></div><p class="muted small" id="ai-load"></p>' : ''}`;
  const hook = () => { const b = $('#ai-test-res .gbar i'), t = $('#ai-load'); if (b) b.style.width = Math.round(AI.web.p * 100) + '%'; if (t) t.textContent = AI.web.text; };
  if (web) AI.hooks.add(hook);
  try {
    const t = await AI.test(r.cfg), b = $('#ai-test-res');
    if (b) b.innerHTML = `<p><span class="chip ok">${ic('check')} اشتغل</span> رد النموذج: <span dir="auto">${esc(excerpt(t, 80))}</span></p>`;
  } catch (e) {
    const b = $('#ai-test-res'), code = (e && e.code) || 'upstream_error';
    if (b) b.innerHTML = `<p class="err" role="alert">${esc(AI.errText(code))}</p>${e && e.detail ? `<p class="muted small" dir="auto">رد الخادم${e.status ? ' (' + e.status + ')' : ''}: ${esc(e.detail)}</p>` : ''}`;
  } finally { AI.hooks.delete(hook); btn.disabled = false; }
};

/* يجلب قائمة النماذج من المزوّد حتى ما تكتب الاسم يدوياً (ويتفادى أخطاء «النموذج غير موجود») */
A['ai-list'] = async (d, btn) => {
  const f = btn.closest('form'), ex = f.dataset.id ? AIC.list.find(x => x.id === f.dataset.id) : null, out = $('#ai-list-res'), dl = $('#ai-dl');
  const fd = new FormData(f), pr = presetById(fd.get('preset')), base = String(fd.get('base') || '').trim();
  const r = aiFormCfg(f, ex);
  if (r.err && r.f !== 'model') { aiShowErr(f, r); return; }
  const key = String(fd.get('key') || '').replace(/\s+/g, '') || (ex && ex.kind === pr.kind && ex.base === base.replace(/\/+$/, '') ? ex.key : '');
  if (pr.key === 'req' && !key) { aiShowErr(f, { err: 'الصق مفتاح API أول، حتى نجلب القائمة.', f: 'key' }); return; }
  btn.disabled = true; out.textContent = 'نجلب القائمة…';
  try {
    const ids = await AI.listModels({ kind: pr.kind, base: base.replace(/\/+$/, ''), key });
    if (dl) dl.innerHTML = ids.map(i => `<option value="${esc(i)}"></option>`).join('');
    out.textContent = ids.length ? 'لقينا ' + ids.length + ' نموذجاً. اضغط خانة «اسم النموذج» واختر منها.' : 'ما رجع المزوّد أي نموذج. اكتب الاسم يدوياً.';
    if (ids.length) { f.elements.model.focus(); f.elements.model.value = ''; }
  } catch (e) {
    const code = (e && e.code) || 'upstream_error';
    out.textContent = AI.errText(code) + (e && e.status ? ' (' + e.status + ')' : '');
  } finally { btn.disabled = false; }
};
